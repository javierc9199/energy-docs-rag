# Questions the corpus cannot answer. The system should abstain on these rather
# than return the "closest" passage. The last five are deliberately near-domain:
# they share real vocabulary with the plant documents.
unanswerable:
  - "¿Cuál es la receta del pulpo a la gallega?"
  - "¿Quién ganó la liga de fútbol en 2023?"
  - "¿Cómo configuro una VPN en Windows?"
  - "¿Cuántos empleados tiene la empresa propietaria?"
  - "¿Cómo se calcula el IVA de una factura?"
  - "¿Cuál es el precio de la electricidad mañana en el mercado?"
  - "¿Qué turbina eólica tiene la planta?"
  - "¿Qué garantía tienen las baterías de almacenamiento?"
  - "¿Cuántos trabajadores había en obra en el pico de la construcción?"
  - "¿Qué dice el plan de seguridad y salud sobre los trabajos en altura?"
