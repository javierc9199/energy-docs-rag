# Hand-written evaluation set. Each question is labelled with the document that
# should answer it (or a list, only where more than one document genuinely states
# the answer, e.g. a threshold repeated in the datasheet and the alarm codes), so retrieval can be scored without a human in the loop.
#
# Questions are phrased the way an engineer would ask them, deliberately NOT
# copying the wording of the documents, so lexical overlap alone does not
# guarantee a hit. Questions whose document is not indexed are skipped and
# reported as such.

questions:
  # --- plant-docs (synthetic corpus, always available) -----------------------
